services:
  database:
    image: postgres:16-alpine
    container_name: grecki-gaj-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: grecki_gaj
      POSTGRES_USER: grecki_gaj
      POSTGRES_PASSWORD: grecki_gaj_dev_2026
    ports:
      - "5433:5432"
    volumes:
      - grecki_gaj_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grecki_gaj -d grecki_gaj"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  grecki_gaj_postgres_data:
    name: grecki_gaj_postgres_data
